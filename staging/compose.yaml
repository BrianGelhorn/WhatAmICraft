name: minecraftquizguesser-dev

x-service-build: &service-build
  context: ..
  dockerfile: Dockerfile.service

services:
  dashboard:
    image: minecraft-quiz-guesser:dev
    build: ..
    entrypoint: ["python3", "dashboard/app.py"]
    restart: unless-stopped
    environment:
      DASHBOARD_PORT: 8787
      CLUES_API_URL: http://clues-api:8790
      ANALYTICS_API_URL: http://analytics-api:8791
      MONITOR_API_URL: http://monitor:8792
      PUBLIC_VIDEO_BASE_URL: http://127.0.0.1:8081
      YOUTUBE_PRIVACY_STATUS: private
      YOUTUBE_CATEGORY_ID: 20
      ELEVENLABS_VOICE_ID: ""
      ELEVENLABS_MODEL: eleven_v3
      REMOTION_CONCURRENCY: "1"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_REVIEW_CHAT_ID: ""
      YOUTUBE_CLIENT_ID: ""
      YOUTUBE_CLIENT_SECRET: ""
      YOUTUBE_REFRESH_TOKEN: ""
      INSTAGRAM_ACCESS_TOKEN: ""
      INSTAGRAM_USER_ID: ""
      META_ACCESS_TOKEN: ""
      FACEBOOK_PAGE_ID: ""
    ports:
      - "127.0.0.1:${STAGING_DASHBOARD_PORT:-8788}:8787"
    volumes:
      - ${STAGING_RUNTIME_DIR:-./runtime}/data:/app/data
      - ${STAGING_RUNTIME_DIR:-./runtime}/out:/app/out
      - ${STAGING_RUNTIME_DIR:-./runtime}/backups:/app/backups
    depends_on:
      - clues-api
      - analytics-api
      - monitor

  clues-api:
    image: minecraft-quiz-guesser:service
    build: *service-build
    entrypoint: ["python3", "scripts/clues_api.py"]
    restart: unless-stopped
    environment:
      CLUES_PORT: 8790
      CLUES_SOURCE_DIR: /app/data/new-clues-20260815
      CLUES_UPLOAD_DIR: /app/data/clues/inbox
      CLUES_USED_TARGETS_PATH: /app/data/used-targets.json
    ports:
      - "127.0.0.1:${STAGING_CLUES_PORT:-8790}:8790"
    volumes:
      - ${STAGING_RUNTIME_DIR:-./runtime}/data:/app/data

  analytics-api:
    image: minecraft-quiz-guesser:service
    build: *service-build
    entrypoint: ["python3", "scripts/analytics_service.py"]
    restart: unless-stopped
    environment:
      ANALYTICS_PORT: 8791
    ports:
      - "127.0.0.1:${STAGING_ANALYTICS_PORT:-8791}:8791"
    volumes:
      - ${STAGING_RUNTIME_DIR:-./runtime}/data:/app/data
      - ${STAGING_RUNTIME_DIR:-./runtime}/out:/app/out
      - ${STAGING_RUNTIME_DIR:-./runtime}/backups:/app/backups

  backup-rollback:
    image: minecraft-quiz-guesser:service
    build: *service-build
    entrypoint: ["python3", "scripts/backup_service.py"]
    restart: unless-stopped
    environment:
      BACKUP_PORT: 8793
      BACKUP_DIR: /app/backups/ops
      BACKUP_KEEP: 14
      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_ADMIN_TOKEN: ${BACKUP_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:${STAGING_BACKUP_PORT:-8793}:8793"
    volumes:
      - ${STAGING_RUNTIME_DIR:-./runtime}/data:/app/data
      - ${STAGING_RUNTIME_DIR:-./runtime}/out:/app/out
      - ${STAGING_RUNTIME_DIR:-./runtime}/backups:/app/backups

  monitor:
    image: minecraft-quiz-guesser:service
    build: *service-build
    entrypoint: ["python3", "scripts/monitor_service.py"]
    restart: unless-stopped
    environment:
      MONITOR_PORT: 8792
      MONITOR_DASHBOARD_URL: http://dashboard:8787
      MONITOR_CLUES_URL: http://clues-api:8790
      MONITOR_ANALYTICS_URL: http://analytics-api:8791
      MONITOR_BACKUP_URL: http://backup-rollback:8793
      MONITOR_MEDIA_URL: http://media
      MONITOR_EVENTS_PATH: /app/out/monitor/events.jsonl
      MONITOR_INTERVAL_SECONDS: 60
    ports:
      - "127.0.0.1:${STAGING_MONITOR_PORT:-8792}:8792"
    volumes:
      - ${STAGING_RUNTIME_DIR:-./runtime}/out:/app/out

  media:
    image: minecraft-quiz-guesser-media:staging
    build:
      context: ..
      dockerfile: Dockerfile.media
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_MEDIA_PORT:-8081}:80"
    volumes:
      - ${STAGING_RUNTIME_DIR:-./runtime}/out/episodes:/mnt/out/episodes:ro
      - ${STAGING_RUNTIME_DIR:-./runtime}/out/thumbnails:/mnt/out/thumbnails:ro

  bot:
    profiles: ["integrations"]
    image: minecraft-quiz-guesser:dev
    build: ..
    entrypoint: ["python3", "scripts/review/bot.py"]
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_REVIEW_CHAT_ID: ""
    volumes:
      - ${STAGING_RUNTIME_DIR:-./runtime}/data:/app/data
      - ${STAGING_RUNTIME_DIR:-./runtime}/out:/app/out

  publisher-worker:
    profiles: ["integrations"]
    image: minecraft-quiz-guesser:dev
    build: ..
    entrypoint: ["python3", "scripts/publish_worker.py"]
    restart: unless-stopped
    environment:
      YOUTUBE_PRIVACY_STATUS: private
      YOUTUBE_CATEGORY_ID: 20
      YOUTUBE_CLIENT_ID: ""
      YOUTUBE_CLIENT_SECRET: ""
      YOUTUBE_REFRESH_TOKEN: ""
      INSTAGRAM_ACCESS_TOKEN: ""
      INSTAGRAM_USER_ID: ""
      META_ACCESS_TOKEN: ""
      FACEBOOK_PAGE_ID: ""
      PUBLISH_QUEUE_INTERVAL: 30
    volumes:
      - ${STAGING_RUNTIME_DIR:-./runtime}/data:/app/data
      - ${STAGING_RUNTIME_DIR:-./runtime}/out:/app/out
