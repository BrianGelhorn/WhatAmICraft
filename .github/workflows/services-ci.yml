name: Services CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "ci/**"
      - "chore/**"
      - "hotfix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dashboard checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile dashboard/app.py
          PYTHONPATH=scripts python scripts/test_dashboard_analytics.py
          PYTHONPATH=scripts python scripts/test_dashboard_oauth.py

  bot:
    name: Telegram bot service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bot behavior contract against fake Telegram API
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/review/bot.py scripts/review/telegram.py
          PYTHONPATH=scripts python scripts/ci/service_contracts.py --bot

  publisher-worker:
    name: Publisher and worker services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publisher and worker behavior contract with provider fake
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/publish.py scripts/publish_worker.py scripts/publishing/*.py
          PYTHONPATH=scripts python scripts/test_publishing.py
          PYTHONPATH=scripts python scripts/test_automatic_publishing.py
          PYTHONPATH=scripts python scripts/test_priorities.py
          PYTHONPATH=scripts python scripts/ci/service_contracts.py --publisher

  producer:
    name: Producer and generation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Producer and automatic rendering checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx remotion browser ensure
          python -m py_compile scripts/produce_quiz_copy.py scripts/thumbnails.py
          PYTHONPATH=scripts python scripts/test_quiz_copy_validation.py
          PYTHONPATH=scripts python scripts/test_automatic_rendering.py
          PYTHONPATH=scripts python scripts/test_thumbnails.py
          python skills/remotion-template-builder/scripts/validate_template_contract.py \
            --manifest templates/quiz-copy/template.contract.json \
            --source-dir src
          npx remotion render QuizCapasCopy out/ci-producer-check.mp4 --frames=0-1
          test -s out/ci-producer-check.mp4

  clues-api:
    name: Clues API service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clues API behavior contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/clues_api.py scripts/clues_client.py
          PYTHONPATH=scripts python scripts/test_clues_api.py
          PYTHONPATH=scripts python scripts/test_clues_api_catalog.py

  analytics-api:
    name: Analytics API service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analytics API behavior contract with provider fake
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/analytics.py scripts/analytics_client.py scripts/analytics_service.py
          PYTHONPATH=scripts python scripts/test_dashboard_analytics.py
          PYTHONPATH=scripts python scripts/test_analytics_service.py

  monitor:
    name: Monitoring service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monitoring behavior contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/monitor_client.py scripts/monitor_service.py
          PYTHONPATH=scripts python scripts/test_monitor_service.py

  media:
    name: Media service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Media behavior contract
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          fixture="$fixture_dir/mc-ci-test.mp4"
          container=""
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::media diagnostics"
              docker ps -a --no-trunc || true
              if [ -n "$container" ]; then
                docker inspect "$container" --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
                docker logs "$container" || true
              fi
              echo "fixture=$fixture"
              curl --silent --show-error --max-time 5 --include http://127.0.0.1:18081/mc-ci-test.mp4 || true
              echo "::endgroup::"
            fi
            if [ -n "$container" ]; then docker rm -f "$container" >/dev/null 2>&1 || true; fi
            rm -rf "$fixture_dir"
            exit "$status"
          }
          trap cleanup EXIT
          printf 'whatamicraft-ci-video' > "$fixture"
          chmod 755 "$fixture_dir"
          chmod 644 "$fixture"
          container="$(docker run -d --rm -p 18081:80 -v "$fixture_dir:/usr/share/nginx/html:ro" nginx:alpine)"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:18081/mc-ci-test.mp4 >/dev/null; then break; fi
            if [ "$attempt" = "30" ]; then exit 1; fi
            sleep 1
          done
          echo 'checking media content type'
          curl --fail --silent --head http://127.0.0.1:18081/mc-ci-test.mp4 | grep -i '^Content-Type: video/mp4'
          echo 'checking media body and bytes'
          test "$(curl --silent --show-error --output "$fixture_dir/body" --write-out '%{http_code}' http://127.0.0.1:18081/mc-ci-test.mp4)" = "200"
          cmp "$fixture" "$fixture_dir/body"
          echo 'checking media byte range'
          test "$(curl --silent --show-error --range 0-4 --output "$fixture_dir/range" --write-out '%{http_code}' http://127.0.0.1:18081/mc-ci-test.mp4)" = "206"
          test "$(wc -c < "$fixture_dir/range")" -eq 5
          echo 'checking missing file and traversal protection'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/missing.mp4)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/../data/quiz-copy-episodes.json)" = "404"

  dashboard-media-integration:
    name: Dashboard/media integration
    needs: [dashboard, bot, publisher-worker, producer, clues-api, analytics-api, monitor, media]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/episodes
          printf 'whatamicraft-ci-video' > out/episodes/mc-ci-test.mp4
      - name: Validate staging compose contract
        run: docker compose -f staging/compose.yaml config --quiet
      - name: Start isolated dashboard and media services
        shell: bash
        run: |
          set -euo pipefail
          project="whatamicraft-ci-${GITHUB_RUN_ID}"
          echo "COMPOSE_PROJECT=$project" >> "$GITHUB_ENV"
          trap 'docker compose -p "$project" -f staging/compose.yaml down -v --remove-orphans' EXIT
          docker compose -p "$project" -f staging/compose.yaml up -d --build dashboard clues-api analytics-api monitor media
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8788/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8081/mc-ci-test.mp4 >/dev/null \
              && curl --fail --silent http://127.0.0.1:8790/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8791/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8792/health >/dev/null \
              && curl --fail --silent 'http://127.0.0.1:8788/api/clues?status=unused' >/dev/null; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              docker compose -p "$project" -f staging/compose.yaml ps
              exit 1
            fi
            sleep 2
          done
          PYTHONPATH=scripts python scripts/ci/service_smoke.py \
            --dashboard http://127.0.0.1:8788 \
            --media http://127.0.0.1:8081 \
            --analytics http://127.0.0.1:8791 \
            --monitor http://127.0.0.1:8792 \
            --fixture mc-ci-test.mp4
