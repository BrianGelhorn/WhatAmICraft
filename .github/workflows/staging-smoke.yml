name: Staging Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to verify"
        required: true
        default: "develop"

permissions:
  contents: read

jobs:
  staging:
    name: Isolated staging verification
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - name: Use runner Python
        uses: ./.github/actions/runner-python
      - name: Prepare isolated persistent staging runtime
        shell: bash
        run: |
          set -euo pipefail
          export STAGING_RUNTIME_DIR="${RUNNER_TEMP}/whatamicraft-staging-${GITHUB_RUN_ID}"
          echo "STAGING_RUNTIME_DIR=$STAGING_RUNTIME_DIR" >> "$GITHUB_ENV"
          PYTHONPATH=scripts python scripts/ci/prepare_staging.py \
            --runtime-root "$STAGING_RUNTIME_DIR" --reset
      - name: Validate and start staging services
        shell: bash
        run: |
          set -euo pipefail
          project="whatamicraft-staging-${GITHUB_RUN_ID}"
          export BACKUP_ADMIN_TOKEN=ci-only-backup-token
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::staging diagnostics"
              docker compose -p "$project" -f staging/compose.yaml ps || true
              docker compose -p "$project" -f staging/compose.yaml logs --no-color --tail=200 || true
              echo "::endgroup::"
            fi
            docker compose -p "$project" -f staging/compose.yaml down -v --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT
          docker compose -p "$project" -f staging/compose.yaml config --quiet
          docker compose -p "$project" -f staging/compose.yaml up -d --build dashboard clues-api analytics-api backup-rollback monitor media
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8788/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8081/mc-ci-test.mp4 >/dev/null \
              && curl --fail --silent http://127.0.0.1:8790/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8791/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8793/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8792/health >/dev/null \
              && curl --fail --silent 'http://127.0.0.1:8788/api/clues?status=unused' >/dev/null; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              docker compose -p "$project" -f staging/compose.yaml ps
              exit 1
            fi
            sleep 2
          done
          PYTHONPATH=scripts python scripts/ci/service_smoke.py \
            --dashboard http://127.0.0.1:8788 \
            --media http://127.0.0.1:8081 \
            --analytics http://127.0.0.1:8791 \
            --monitor http://127.0.0.1:8792 \
            --backup http://127.0.0.1:8793 \
            --backup-token ci-only-backup-token \
            --runtime-root "$STAGING_RUNTIME_DIR" \
            --fixture mc-ci-test.mp4
