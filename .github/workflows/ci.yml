name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "ci/**"
      - "chore/**"
      - "docs/**"
      - "hotfix/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: [self-hosted, linux, x64, whatamicraft-mini-pc]

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify locked ESLint toolchain
        run: node scripts/test_lint_toolchain.mjs

      - name: Lint and type-check
        run: npm run lint

      - name: Build Remotion bundle
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall dashboard scripts

      - name: Prepare disposable media fixtures
        run: python scripts/ci/prepare_media_fixtures.py

      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail
          for test in scripts/test_*.py; do
            PYTHONPATH=scripts python "$test"
          done
